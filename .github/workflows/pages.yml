# Deploys the repository root (which is the site) to GitHub Pages.
#
# One-time setup, which only a repository admin can do:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# The GITHUB_TOKEN of a workflow is not allowed to create the Pages site
# itself, so until that is set this workflow fails on "Create Pages site
# failed: Resource not accessible by integration".
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/sweet-knuth-wjcwjj]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Check the kinematics
        run: node tests/kinematics.test.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
